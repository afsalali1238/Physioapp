name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The app lives in anatomy-explorer/, not at the repo root — every step
# runs there. (The old workflow ran at the root, where there is no
# package.json, so setup-node's npm cache lookup failed before anything
# else could run. It also pinned Node 20 while the app requires >= 22,
# called a `lint` script that does not exist, and ran `sync:content`,
# which pulls the live sheet and rewrites content files — a manual
# operation, not a PR check.)
defaults:
  run:
    working-directory: anatomy-explorer

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: anatomy-explorer/package-lock.json

    - name: Install dependencies
      # `npm ci`, not `npm install`: strict cold install from the lockfile.
      # (Vercel production builds already succeed with plain `npm install`;
      # if this step ever fails while Vercel is green, the lockfile has
      # drifted from package.json again — regenerate it with one healthy
      # `npm install` and commit the result, do not relax this to install.)
      run: |
        node --version
        npm --version
        pwd
        ls
        # Verbose log is tailed into the job output and uploaded, so a fast
        # failure like this one leaves evidence instead of a bare exit code.
        npm ci --loglevel verbose > "$RUNNER_TEMP/npm-install.log" 2>&1 || INSTALL_FAILED=1
        tail -n 60 "$RUNNER_TEMP/npm-install.log"
        if [ "${INSTALL_FAILED:-0}" = "1" ]; then exit 1; fi

    - name: Upload install log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: npm-install-log
        path: ${{ runner.temp }}/npm-install.log
        retention-days: 3

    - name: Typecheck
      run: npm run typecheck

    - name: Content and asset gates
      run: npm run check:all

    - name: Build
      run: npm run build
