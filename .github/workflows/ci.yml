name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint
      
    # Environment variables for sync-content
    - name: Sync content test
      run: npm run sync:content
      env:
        SHEET_ID: ${{ secrets.SHEET_ID }}
        
    - name: Build
      run: npm run build
