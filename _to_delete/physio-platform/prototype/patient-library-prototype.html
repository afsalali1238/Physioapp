<title>Home Exercise Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">

<style>
:root{
  --ground:#EEF1EE;
  --surface:#FFFFFF;
  --surface-2:#E3E8E4;
  --ink:#17211D;
  --ink-2:#4B5B55;
  --ink-3:#7C8C86;
  --line:#D5DDD8;
  --line-2:#B7C3BD;
  --brand:#12433A;
  --brand-ink:#FFFFFF;

  --mobility:#41618F;   --mobility-bg:#E2E8F1;
  --stretch:#8F5310;    --stretch-bg:#F5E8D6;
  --strengthen:#175C4E; --strengthen-bg:#DBEAE5;

  --warn:#7E5200;       --warn-bg:#F7EFDC;
  --slot:#E6EBE8;       --slot-line:#BECAC5;

  --f-d:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-b:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;

  --r:14px;
  --pad:clamp(15px,4vw,24px);
  --scale:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1412;   --surface:#161E1B;  --surface-2:#1F2926;
    --ink:#E7EEEA;      --ink-2:#A3B2AC;    --ink-3:#75847E;
    --line:#28332F;     --line-2:#3A4642;
    --brand:#66C6B0;    --brand-ink:#0E1412;
    --mobility:#93A9D4; --mobility-bg:#1E2734;
    --stretch:#D89E58;  --stretch-bg:#332619;
    --strengthen:#57BCA3;--strengthen-bg:#18302B;
    --warn:#D6A94F;     --warn-bg:#2E2716;
    --slot:#1C2522;     --slot-line:#313E39;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1412;   --surface:#161E1B;  --surface-2:#1F2926;
  --ink:#E7EEEA;      --ink-2:#A3B2AC;    --ink-3:#75847E;
  --line:#28332F;     --line-2:#3A4642;
  --brand:#66C6B0;    --brand-ink:#0E1412;
  --mobility:#93A9D4; --mobility-bg:#1E2734;
  --stretch:#D89E58;  --stretch-bg:#332619;
  --strengthen:#57BCA3;--strengthen-bg:#18302B;
  --warn:#D6A94F;     --warn-bg:#2E2716;
  --slot:#1C2522;     --slot-line:#313E39;
}

*{box-sizing:border-box;}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-b);
  font-size:calc(17px * var(--scale));
  line-height:1.55;-webkit-text-size-adjust:100%;
}
.wrap{max-width:780px;margin:0 auto;padding:0 var(--pad) 64px;}

/* review banner ------------------------------------------------ */
.review{
  background:var(--warn-bg);color:var(--warn);
  font-family:var(--f-d);font-weight:600;
  font-size:calc(12px * var(--scale));letter-spacing:.06em;text-transform:uppercase;
  text-align:center;padding:7px 14px;line-height:1.4;
}

/* top bar ------------------------------------------------------- */
.top{position:sticky;top:0;z-index:40;background:var(--brand);color:var(--brand-ink);}
.top-in{max-width:780px;margin:0 auto;padding:11px var(--pad);display:flex;align-items:center;gap:10px;}
.brandmark{font-family:var(--f-d);font-weight:700;font-size:calc(15px * var(--scale));margin:0;flex:1;min-width:0;line-height:1.2;}
.brandmark span{display:block;font-weight:500;font-size:calc(10.5px * var(--scale));letter-spacing:.15em;text-transform:uppercase;opacity:.7;}
.tbtn{
  font-family:var(--f-d);font-weight:600;font-size:calc(13px * var(--scale));
  background:transparent;color:inherit;border:1px solid currentColor;
  border-radius:999px;padding:5px 12px;cursor:pointer;opacity:.8;white-space:nowrap;min-height:34px;
}
.tbtn:hover{opacity:1;}
.tbtn:focus-visible{outline:2px solid currentColor;outline-offset:3px;opacity:1;}

/* back --------------------------------------------------------- */
.back{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--f-d);font-weight:600;font-size:calc(14px * var(--scale));
  color:var(--ink-2);text-decoration:none;padding:18px 2px 2px;min-height:44px;
}
.back:hover{color:var(--ink);}
.back:focus-visible{outline:2px solid var(--ink-3);outline-offset:2px;border-radius:6px;}

/* hero --------------------------------------------------------- */
.hero{padding:26px 0 4px;}
.hero h1{
  font-family:var(--f-d);font-weight:700;
  font-size:calc(clamp(28px,7.5vw,40px) * var(--scale));
  line-height:1.08;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance;
}
.hero p{margin:0;color:var(--ink-2);max-width:56ch;font-size:calc(17px * var(--scale));}
.crumb{
  font-family:var(--f-d);font-weight:600;font-size:calc(11px * var(--scale));
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;
}

/* two big choices ---------------------------------------------- */
.choices{display:grid;gap:12px;margin-top:24px;}
@media(min-width:600px){.choices{grid-template-columns:1fr 1fr;}}
.choice{
  display:block;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 22px;min-height:150px;
  display:flex;flex-direction:column;justify-content:space-between;gap:14px;
  transition:border-color .12s ease, transform .12s ease;
}
.choice:hover{border-color:var(--line-2);transform:translateY(-2px);}
.choice:focus-visible{outline:3px solid var(--brand);outline-offset:2px;}
.choice .ic{width:38px;height:38px;color:var(--ink-3);}
.choice h2{font-family:var(--f-d);font-weight:700;font-size:calc(23px * var(--scale));margin:0 0 5px;letter-spacing:-.01em;}
.choice p{margin:0;color:var(--ink-2);font-size:calc(15.5px * var(--scale));line-height:1.45;}

/* guidance ----------------------------------------------------- */
.guide{margin:26px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;}
.guide h3{font-family:var(--f-d);font-weight:600;font-size:calc(11.5px * var(--scale));letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;}
.guide ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;}
.guide li{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;font-size:calc(15.5px * var(--scale));color:var(--ink-2);}
.guide li b{color:var(--ink);font-weight:600;}
.dot{width:19px;height:19px;border-radius:6px;margin-top:3px;background:var(--strengthen-bg);color:var(--strengthen);display:grid;place-items:center;font-size:calc(11px * var(--scale));font-weight:700;}

/* area grid ---------------------------------------------------- */
.areas{display:grid;gap:9px;grid-template-columns:1fr;margin-top:20px;}
@media(min-width:560px){.areas{grid-template-columns:1fr 1fr;}}
.area{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:15px 17px;text-decoration:none;color:inherit;min-height:62px;
  font-size:calc(17.5px * var(--scale));font-weight:600;
  transition:border-color .12s ease;
}
.area:hover{border-color:var(--line-2);}
.area:focus-visible{outline:3px solid var(--brand);outline-offset:2px;}
.area .n{font-family:var(--f-m);font-size:calc(12px * var(--scale));color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums;}
.area.soon{background:transparent;border-style:dashed;color:var(--ink-3);font-weight:500;cursor:default;}
.area.soon .n{font-size:calc(11px * var(--scale));letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-d);}

/* start-here banner -------------------------------------------- */
.starthere{
  margin:22px 0 4px;padding:14px 17px;border-radius:12px;
  background:var(--strengthen-bg);color:var(--strengthen);
  font-size:calc(15.5px * var(--scale));line-height:1.45;
}
.starthere b{font-family:var(--f-d);font-weight:700;}

/* item card ---------------------------------------------------- */
.items{display:grid;gap:16px;margin-top:16px;}
.item{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;scroll-margin-top:70px;
}
.item.done{border-color:var(--strengthen);}
.figure{
  position:relative;background:var(--slot);border-bottom:1px solid var(--line);
  aspect-ratio:4/3;display:grid;place-items:center;
}
.figure img{width:100%;height:100%;object-fit:cover;display:block;}
.ph{display:grid;place-items:center;gap:9px;color:var(--slot-line);text-align:center;padding:16px;}
.ph svg{width:52px;height:52px;}
.ph code{font-family:var(--f-m);font-size:calc(11px * var(--scale));color:var(--ink-3);letter-spacing:.06em;}
.ibody{padding:17px 19px 20px;display:grid;gap:13px;}

.ihead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.inum{font-family:var(--f-m);font-size:calc(12.5px * var(--scale));font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;}
.chip{
  font-family:var(--f-d);font-weight:600;font-size:calc(11px * var(--scale));
  letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;
}
.chip.mobility{background:var(--mobility-bg);color:var(--mobility);}
.chip.stretch{background:var(--stretch-bg);color:var(--stretch);}
.chip.strengthen{background:var(--strengthen-bg);color:var(--strengthen);}
.item h3{
  font-family:var(--f-d);font-weight:700;font-size:calc(21px * var(--scale));
  margin:0;line-height:1.18;letter-spacing:-.012em;text-wrap:balance;
}

/* dosage block — the scannable bit */
.dose{
  display:flex;flex-wrap:wrap;gap:0;
  border:1px solid var(--line);border-radius:11px;overflow:hidden;
  background:var(--surface-2);
}
.dose div{
  flex:1 1 0;min-width:74px;padding:10px 12px;
  border-inline-end:1px solid var(--line);
}
.dose div:last-child{border-inline-end:none;}
.dose dt{
  font-family:var(--f-d);font-weight:600;font-size:calc(10px * var(--scale));
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 2px;
}
.dose dd{
  margin:0;font-family:var(--f-m);font-weight:600;
  font-size:calc(17px * var(--scale));font-variant-numeric:tabular-nums;color:var(--ink);
  line-height:1.2;
}
.dose dd small{font-family:var(--f-b);font-weight:600;font-size:calc(12.5px * var(--scale));color:var(--ink-2);}

/* steps */
.steps{display:grid;gap:9px;margin:0;}
.step{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:baseline;}
.step dt{
  font-family:var(--f-d);font-weight:600;font-size:calc(10.5px * var(--scale));
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  width:74px;flex:none;padding-top:2px;
}
.step dd{margin:0;font-size:calc(16.5px * var(--scale));color:var(--ink);line-height:1.45;}

.muscles{
  font-size:calc(15.5px * var(--scale));color:var(--ink-2);margin:0;
  padding-top:11px;border-top:1px solid var(--line);
}
.muscles b{color:var(--ink);font-weight:600;}
.safety{
  display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;
  background:var(--warn-bg);color:var(--warn);
  border-radius:10px;padding:11px 13px;margin:0;
  font-size:calc(15px * var(--scale));line-height:1.45;
}
.safety svg{width:18px;height:18px;flex:none;margin-top:2px;}

.tick{
  display:flex;align-items:center;gap:10px;cursor:pointer;
  font-family:var(--f-d);font-weight:600;font-size:calc(14.5px * var(--scale));
  color:var(--ink-2);background:transparent;border:1px solid var(--line-2);
  border-radius:10px;padding:11px 14px;min-height:46px;width:100%;
  justify-content:center;
}
.tick:hover{border-color:var(--ink-3);}
.tick:focus-visible{outline:3px solid var(--brand);outline-offset:2px;}
.tick[aria-pressed="true"]{background:var(--strengthen-bg);color:var(--strengthen);border-color:var(--strengthen);}

/* footer ------------------------------------------------------- */
.disc{
  margin-top:34px;padding:17px 19px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);
  font-size:calc(14px * var(--scale));color:var(--ink-2);line-height:1.5;
}
.disc b{color:var(--ink);font-weight:600;display:block;margin-bottom:5px;font-family:var(--f-d);}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px;}
.tool{
  font-family:var(--f-d);font-weight:600;font-size:calc(14px * var(--scale));
  background:var(--surface);color:var(--ink-2);
  border:1px solid var(--line-2);border-radius:10px;
  padding:10px 15px;cursor:pointer;min-height:44px;
}
.tool:hover{color:var(--ink);border-color:var(--ink-3);}
.tool:focus-visible{outline:3px solid var(--brand);outline-offset:2px;}

@media (prefers-reduced-motion: reduce){*{transition:none !important;}}

@media print{
  .top,.review,.tools,.tick,.back,.guide,.starthere{display:none !important;}
  body{background:#fff;color:#000;font-size:11pt;}
  .wrap{max-width:none;padding:0;}
  .item{break-inside:avoid;border:1px solid #999;margin-bottom:10pt;}
  .figure{aspect-ratio:auto;height:130pt;}
  .hero h1{font-size:20pt;}
  .disc{border:1px solid #999;}
}
</style>

<div class="review" id="reviewbar">Sample content for layout review · Not clinically approved</div>

<header class="top">
  <div class="top-in">
    <p class="brandmark"><span>Physiotherapy</span>Home Exercise Library</p>
    <button class="tbtn" id="textsize" type="button" aria-label="Change text size">A<sup>+</sup></button>
  </div>
</header>

<div class="wrap"><main id="app"></main></div>

<script>
/* ---------------------------------------------------------------
   SAMPLE CONTENT — neck only, both sections.
   Drafted for layout review. Not clinically reviewed or approved.

const AREAS = {

    {id:"hip", name:"Hip"},
    {id:"knee", name:"Knee"},
    {id:"ankle", name:"Ankle"},
    {id:"foot", name:"Foot"}
  ]
};

const ITEMS = {
  "stretching/neck": {
    startHere: "Start with the first two. Add the others once those feel comfortable.",
    list: [
      {id:"str-neck-01", type:"stretch", img:"str-neck-01", name:"Side Neck Stretch",
       start:"Sit upright on a chair with both feet flat on the floor.",
       move:"Let your right ear drop slowly towards your right shoulder.",
       dir:"Keep your left shoulder relaxed and down. Do not turn your head.",
       hold:"30 sec", reps:"3", each:"each side", freq:"Twice a day",
       muscles:"Upper trapezius",
       safety:"Stop if you feel pain or tingling travelling down your arm."},

      {id:"str-neck-02", type:"stretch", img:"str-neck-02", name:"Levator Scapulae Stretch",
       start:"Sit upright. Turn your head about 45 degrees to the right.",
       move:"Look down towards your right armpit until you feel a stretch on the left side of your neck.",
       dir:"Keep your left shoulder down. You can hold the chair with your left hand.",
       hold:"30 sec", reps:"3", each:"each side", freq:"Twice a day",

      {id:"str-neck-03", type:"stretch", img:"str-neck-03", name:"Chin to Chest Stretch",

      {id:"str-neck-04", type:"stretch", img:"str-neck-04", name:"Neck Rotation Stretch",
       start:"Sit upright, looking straight ahead.",

    ]
  },

  "exercises/neck": {
    startHere: "Start with the first two exercises. Your physiotherapist will tell you when to add the rest.",
    list: [
      {id:"ex-neck-01", type:"mobility", img:"ex-neck-01", name:"Neck Range of Motion",
       start:"Sit upright on a chair with your feet flat on the floor.",
       move:"Slowly move your head in one direction at a time: forward, back, to each side, then turn to each side.",
       ret:"Return to the middle and pause before the next direction.",
       reps:"5", each:"each direction", freq:"Once a day", label:"Warm-up",
       muscles:"Neck joints and muscles",
       safety:"Move only as far as is comfortable. Never force a movement."},

      {id:"ex-neck-02", type:"strengthen", img:"ex-neck-02", name:"Chin Tuck",
       start:"Sit upright with your feet flat on the floor and your shoulders relaxed.",
       move:"Draw your chin straight back, as if making a double chin. Keep your eyes level.",
       ret:"Release slowly and return your head to a comfortable position.",
       hold:"5 sec", reps:"10", freq:"Twice a day",
       muscles:"Deep neck flexors",
       safety:"Stop if you feel dizzy or get pain down your arm."},

      {id:"ex-neck-03", type:"strengthen", img:"ex-neck-03", name:"Isometric Neck Hold",
       start:"Sit upright. Place your palm flat against your forehead.",
       move:"Press your head gently into your hand. Your head should not move at all.",
       ret:"Release slowly. Repeat with your hand at the back and then each side of your head.",
       hold:"5 sec", reps:"5", each:"each direction", freq:"Once a day",
       muscles:"Neck stabilising muscles",
       safety:"Press gently, about a quarter of your strength. Stop if you feel pain."},

      {id:"ex-neck-04", type:"strengthen", img:"ex-neck-04", name:"Scapular Squeeze",
       start:"Sit or stand upright with your arms relaxed by your sides.",
       move:"Draw your shoulder blades back and down, as if holding a pencil between them.",

       hold:"5 sec", reps:"10", freq:"Twice a day",
       muscles:"Rhomboids and middle trapezius",

      {id:"ex-neck-05", type:"mobility", img:"ex-neck-05", name:"Wall Angel",

       reps:"10", freq:"Once a day",
       muscles:"Middle and lower trapezius, serratus anterior",
       safety:"Only go as high as you can without your back arching away from the wall."}
    ]
  }
};

const DISCLAIMER = "This page is for information only. It is not a substitute for assessment by a physiotherapist, and it is not a diagnosis. These exercises are a reminder of what you have already been shown in the clinic. Stop and contact the clinic if an exercise causes new, sharp or increasing pain, dizziness, numbness or breathlessness. In an emergency, call 998.";

const SECT = {
  stretching:{
    title:"Stretching",
    lede:"Choose the part of your body you want to stretch.",
    icon:'<svg class="ic" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="7" r="3.4"/><path d="M20 10.6v11M20 21.6 13.5 33M20 21.6 26.5 33M8.5 15.5 20 13.2l11.5 2.3"/></svg>'

  }
};

const FIGGLYPH = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="9" r="4.4"/><path d="M24 13.8v14.4M24 28.2 17 42M24 28.2 31 42M10 20 24 17.5 38 20"/></svg>';

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- local state (this phone only) ---- */
let SCALE = 1, DONE = {};
try{
  const s = parseFloat(localStorage.getItem("pt-scale")); if(s >= 1 && s <= 1.5) SCALE = s;
  const d = localStorage.getItem("pt-done-" + new Date().toDateString());
  if(d) DONE = JSON.parse(d) || {};
}catch(e){}
function persist(){
  try{
    localStorage.setItem("pt-scale", String(SCALE));
    localStorage.setItem("pt-done-" + new Date().toDateString(), JSON.stringify(DONE));
  }catch(e){}
}
document.documentElement.style.setProperty("--scale", SCALE);

/* ---- views ---- */
function homeView(){
  return `<section class="hero">
      <h1>Your home exercises</h1>
      <p>Two things to choose from. Pick the one your physiotherapist asked you to do.</p>
    </section>

    <div class="choices">
      <a class="choice" href="#stretching">
        ${SECT.stretching.icon}
        <div><h2>Stretching</h2><p>Loosen a tight area. Hold each position, do not bounce.</p></div>
      </a>
      <a class="choice" href="#exercises">
        ${SECT.exercises.icon}
        <div><h2>Exercise Protocols</h2><p>Build strength and control. A short set for one body area.</p></div>
      </a>
    </div>

    <section class="guide">
      <h3>How to use this</h3>
      <ul>
        <li><span class="dot" aria-hidden="true">1</span><span><b>Only do what you were given.</b> Your physiotherapist chose your area and your exercises.</span></li>
        <li><span class="dot" aria-hidden="true">2</span><span><b>Mild discomfort is fine. Sharp pain is not.</b> Stop at sharp pain and tell the clinic.</span></li>
        <li><span class="dot" aria-hidden="true">3</span><span><b>Little and often beats a lot at once.</b> A short set twice a day works better than one long session.</span></li>
        <li><span class="dot" aria-hidden="true">4</span><span><b>Move slowly.</b> Control matters more than how far you go.</span></li>
      </ul>
    </section>

    ${disclaimerHTML()}`;
}

function sectionView(key){
  const s = SECT[key], list = AREAS[key];
  const tiles = list.map(a => {
    const n = (ITEMS[key + "/" + a.id] || {}).list;
    if(a.live && n) return `<a class="area" href="#${key}/${a.id}"><span>${esc(a.name)}</span><span class="n">${n.length}</span></a>`;
    return `<div class="area soon"><span>${esc(a.name)}</span><span class="n">In preparation</span></div>`;
  }).join("");

  return `<a class="back" href="#"><span aria-hidden="true">←</span>Home</a>
    <section class="hero">
      <p class="crumb">${esc(s.title)}</p>
      <h1>Which area?</h1>
      <p>${esc(s.lede)}</p>
    </section>
    <div class="areas">${tiles}</div>
    ${disclaimerHTML()}`;
}

function areaView(key, areaId){
  const s = SECT[key];
  const area = AREAS[key].find(a => a.id === areaId);
  const data = ITEMS[key + "/" + areaId];
  if(!area || !data) return sectionView(key);

  const cards = data.list.map((it, i) => itemHTML(it, i + 1)).join("");
  const start = data.startHere
    ? `<p class="starthere"><b>Start here.</b> ${esc(data.startHere)}</p>` : "";

  return `<a class="back" href="#${key}"><span aria-hidden="true">←</span>${esc(s.title)}</a>
    <section class="hero">
      <p class="crumb">${esc(s.title)}</p>
      <h1>${esc(area.name)}</h1>
      <p>${data.list.length} ${data.list.length === 1 ? "exercise" : "exercises"}. Work down the page in order.</p>
    </section>
    ${start}
    <div class="items">${cards}</div>
    <div class="tools">
      <button class="tool" type="button" onclick="window.print()">Print this page</button>
    </div>
    ${disclaimerHTML()}`;
}

function doseHTML(it){
  const cells = [];
  if(it.hold) cells.push(["Hold", it.hold]);
  if(it.reps) cells.push(["Repeat", it.reps + " times"]);
  if(it.sets) cells.push(["Sets", it.sets]);
  if(it.each) cells.push(["Sides", it.each]);
  if(it.freq) cells.push(["How often", it.freq]);
  return `<dl class="dose">${cells.map(c =>
    `<div><dt>${esc(c[0])}</dt><dd>${esc(c[1])}</dd></div>`).join("")}</dl>`;
}

function itemHTML(it, n){
  const steps = [];
  steps.push(["Start", it.start]);
  steps.push(["Movement", it.move]);
  if(it.dir) steps.push(["Keep in mind", it.dir]);
  if(it.ret) steps.push(["Return", it.ret]);

  const isDone = !!DONE[it.id];
  return `<article class="item${isDone ? " done" : ""}" id="${esc(it.id)}">
    <div class="figure">
      <div class="ph">${FIGGLYPH}<code>${esc(it.img)}</code></div>
    </div>
    <div class="ibody">
      <div class="ihead">
        <span class="inum">${String(n).padStart(2, "0")}</span>
        <span class="chip ${esc(it.type)}">${it.label ? esc(it.label) : (it.type === "mobility" ? "Mobility" : it.type === "stretch" ? "Stretch" : "Strengthen")}</span>
      </div>
      <h3>${esc(it.name)}</h3>
      ${doseHTML(it)}
      <dl class="steps">${steps.map(s =>
        `<div class="step"><dt>${esc(s[0])}</dt><dd>${esc(s[1])}</dd></div>`).join("")}</dl>
      <p class="muscles">Works on <b>${esc(it.muscles)}</b></p>
      <p class="safety">${WARNGLYPH}<span>${esc(it.safety)}</span></p>
      <button class="tick" type="button" data-id="${esc(it.id)}" aria-pressed="${isDone}">${isDone ? "Done today" : "Mark as done"}</button>
    </div>
  </article>`;
}

function disclaimerHTML(){
  return `<p class="disc"><b>Important</b>${esc(DISCLAIMER)}</p>`;
}

function render(){
  const h = location.hash.replace("#", "");
  const parts = h.split("/").filter(Boolean);
  let html;
  if(parts.length === 0) html = homeView();
  else if(parts.length === 1 && SECT[parts[0]]) html = sectionView(parts[0]);
  else if(parts.length === 2 && SECT[parts[0]]) html = areaView(parts[0], parts[1]);
  else html = homeView();
  document.getElementById("app").innerHTML = html;
  window.scrollTo(0, 0);
}

document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest(".tick");
  if(!b) return;
  const id = b.dataset.id, on = b.getAttribute("aria-pressed") === "true";
  if(on){ delete DONE[id]; } else { DONE[id] = 1; }
  b.setAttribute("aria-pressed", String(!on));
  b.textContent = !on ? "Done today" : "Mark as done";
  b.closest(".item").classList.toggle("done", !on);
  persist();
});

document.getElementById("textsize").addEventListener("click", () => {
  SCALE = SCALE >= 1.3 ? 1 : Math.round((SCALE + 0.15) * 100) / 100;
  document.documentElement.style.setProperty("--scale", SCALE);
  persist();
});

window.addEventListener("hashchange", render);
render();
</script>
